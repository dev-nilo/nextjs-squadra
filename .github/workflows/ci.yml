name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on main when a push never started a run (a GitHub Actions
  # outage once lost the push of #118). It goes through the same checks and
  # the same supabase-production approval as a push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; a running run on main never is, so a
  # production migration is never cut off by the next merge. (A run on main
  # still waiting in the queue is replaced by a newer one, which deploys the
  # newer main.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: nothing in CI talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  database:
    name: Database, RLS and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase binds 54321-54329, which sits inside Linux's default ephemeral range
      # (32768-60999). An outgoing connection during the image pulls can grab one of
      # those ports first and the DB container then fails with "address already in use".
      # Moving the ephemeral range above 60000 keeps them free.
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - name: Start local Supabase (applies migrations + seed)
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Lint the schema
        run: npx supabase db lint --level warning --fail-on error
      # The types in lib/supabase/tipos-do-banco.ts come from the migrations.
      # A migration that changes the schema without `npm run db:types` fails here.
      - name: Check the generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/tipos-do-banco.ts || {
            echo "::error file=lib/supabase/tipos-do-banco.ts::Out of date with the migrations. Run npm run db:types and commit it."
            exit 1
          }
      - name: Check the seed landed
        run: |
          count=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from public.players")
          echo "players: $count"
          test "$count" -eq 23
      - name: Export local Supabase URL and keys
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/supabase.json")"
          url=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")
          anon=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/supabase.json")
          service=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/supabase.json")
          db=$(jq -r '.DB_URL' "$RUNNER_TEMP/supabase.json")
          for v in "$url" "$anon" "$service" "$db"; do test -n "$v" && test "$v" != null; done
          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_DB_URL=$db"
            echo "SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"
      - name: Integration tests (RLS, database functions)
        run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Shared staging database: every PR from this repo pushes its migrations there
  # once the checks pass, so the Vercel preview (pointed at staging) runs on the
  # new schema. Skipped until the staging secrets exist (docs/staging.md).
  migrate-staging:
    name: Migrate staging
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, database]
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-staging
      cancel-in-progress: false
    steps:
      # The PR checkout is a merge commit whose first parent is the base, so
      # two commits are enough to see what this PR adds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Staging is shared by every open PR. A PR that adds no migration has
      # nothing to push, and pushing anyway would fail whenever another open
      # PR's migration already reached staging ("remote migration versions
      # not found locally"), blocking app-only PRs for no reason.
      # STAGING_DB_URL (staging's session pooler URL, with its password) goes to
      # the steps that use it only. No account-wide Supabase token lives in
      # GitHub (docs/staging.md).
      - name: Check staging is configured and this PR adds migrations
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        id: gate
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::Staging secrets are not set, skipping. See docs/staging.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          novas=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- supabase/migrations)
          if [ -z "$novas" ]; then
            echo "::notice::This PR adds no migration, nothing to push to staging."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Migrations in this PR:"
            echo "$novas"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Pending migrations
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        if: steps.gate.outputs.ready == 'true'
        run: npx supabase db push --remote="$DB_URL" --dry-run --yes
      - name: Apply migrations to staging
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
        if: steps.gate.outputs.ready == 'true'
        run: npx supabase db push --remote="$DB_URL" --yes

  # Production only changes here, after a merge to main (or a run by hand on
  # main) and green checks.
  migrate-production:
    name: Migrate production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [checks, database]
    runs-on: ubuntu-latest
    environment: supabase-production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    steps:
      # PROD_DB_URL is an environment secret of supabase-production: only a job
      # in that environment, on a protected branch and after the approval, can
      # read it. Each step that needs it gets it, and nothing else does (npm
      # ci's install scripts don't). No skip when it's missing: the deploy waits
      # on this job, so skipping would put the app live without its migrations.
      - name: Check production is configured
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          test -n "$DB_URL" || {
            echo "::error::Set PROD_DB_URL in the supabase-production environment. See docs/staging.md."
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production was built by hand before migrations existed. If its history
      # doesn't record the baseline, pushing would replay the whole schema on top
      # of the live one, so stop and ask for the one-time repair instead.
      - name: Pending migrations (refuse to replay the baseline)
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          # pipefail: a failed connection must fail here, not hide behind tee.
          set -o pipefail
          npx supabase db push --remote="$DB_URL" --dry-run --yes 2>&1 | tee "$RUNNER_TEMP/pending.txt"
          if grep -q 20261109000000 "$RUNNER_TEMP/pending.txt"; then
            echo "::error::Production has no record of the baseline migration. Run the 'Production baseline' workflow (check, then repair) first. See docs/staging.md."
            exit 1
          fi
      - name: Apply migrations to production
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
        run: npx supabase db push --remote="$DB_URL" --yes

  # Production deploys from here, not from Vercel's Git integration (vercel.json
  # turns that off for main), so the app never goes live before the migrations
  # it depends on. Vercel still builds it, with the Production env vars it holds.
  deploy-production:
    name: Deploy production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [migrate-production]
    runs-on: ubuntu-latest
    # Holds VERCEL_TOKEN as an environment secret, readable on protected
    # branches only. No reviewer: the approval is migrate-production's.
    environment: vercel-production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Not secret: they name the team and project, the token grants access.
      VERCEL_ORG_ID: team_C1FkuendGkhTzvyVD2k0Cpra
      VERCEL_PROJECT_ID: prj_HS599jsot57tfq3rjZASbDKhA068
    steps:
      # No skip here: with Git deploys off for main, skipping would mean
      # production silently stops updating.
      - name: Check Vercel is configured
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Set VERCEL_TOKEN in the vercel-production environment. Production only deploys from this job. See docs/staging.md."
            exit 1
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy to production
        run: npx --yes vercel@64.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"
