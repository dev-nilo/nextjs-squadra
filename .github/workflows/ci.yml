name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main never are, so a production
  # migration is never cut off by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: nothing in CI talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  database:
    name: Database, RLS and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase binds 54321-54329, which sits inside Linux's default ephemeral range
      # (32768-60999). An outgoing connection during the image pulls can grab one of
      # those ports first and the DB container then fails with "address already in use".
      # Moving the ephemeral range above 60000 keeps them free.
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - name: Start local Supabase (applies migrations + seed)
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Lint the schema
        run: npx supabase db lint --level warning --fail-on error
      - name: Check the seed landed
        run: |
          count=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from public.players")
          echo "players: $count"
          test "$count" -eq 23
      - name: Export local Supabase URL and keys
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/supabase.json")"
          url=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")
          anon=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/supabase.json")
          service=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/supabase.json")
          for v in "$url" "$anon" "$service"; do test -n "$v" && test "$v" != null; done
          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"
      - name: Integration tests (RLS, database functions)
        run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Shared staging database: every PR from this repo pushes its migrations there
  # once the checks pass, so the Vercel preview (pointed at staging) runs on the
  # new schema. Skipped until the staging secrets exist (docs/staging.md).
  migrate-staging:
    name: Migrate staging
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, database]
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      # The PR checkout is a merge commit whose first parent is the base, so
      # two commits are enough to see what this PR adds.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # Staging is shared by every open PR. A PR that adds no migration has
      # nothing to push, and pushing anyway would fail whenever another open
      # PR's migration already reached staging ("remote migration versions
      # not found locally"), blocking app-only PRs for no reason.
      - name: Check staging is configured and this PR adds migrations
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Staging secrets are not set, skipping. See docs/staging.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          novas=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- supabase/migrations)
          if [ -z "$novas" ]; then
            echo "::notice::This PR adds no migration, nothing to push to staging."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Migrations in this PR:"
            echo "$novas"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      - name: Pending migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx supabase db push --remote="$PROJECT_REF" --dry-run --yes
      - name: Apply migrations to staging
        if: steps.gate.outputs.ready == 'true'
        run: npx supabase db push --remote="$PROJECT_REF" --yes

  # Production only changes here, after a merge to main and green checks.
  migrate-production:
    name: Migrate production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database]
    runs-on: ubuntu-latest
    environment: supabase-production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
    steps:
      - name: Check production is configured
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Production secrets are not set, skipping. See docs/staging.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'
      # Production was built by hand before migrations existed. If its history
      # doesn't record the baseline, pushing would replay the whole schema on top
      # of the live one, so stop and ask for the one-time repair instead.
      - name: Pending migrations (refuse to replay the baseline)
        if: steps.gate.outputs.ready == 'true'
        run: |
          npx supabase db push --remote="$PROJECT_REF" --dry-run --yes 2>&1 | tee "$RUNNER_TEMP/pending.txt"
          if grep -q 20261109000000 "$RUNNER_TEMP/pending.txt"; then
            echo "::error::Production has no record of the baseline migration. Run the 'Production baseline' workflow (check, then repair) first. See docs/staging.md."
            exit 1
          fi
      - name: Apply migrations to production
        if: steps.gate.outputs.ready == 'true'
        run: npx supabase db push --remote="$PROJECT_REF" --yes

  # Production deploys from here, not from Vercel's Git integration (vercel.json
  # turns that off for main), so the app never goes live before the migrations
  # it depends on. Vercel still builds it, with the Production env vars it holds.
  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [migrate-production]
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Not secret: they name the team and project, the token grants access.
      VERCEL_ORG_ID: team_C1FkuendGkhTzvyVD2k0Cpra
      VERCEL_PROJECT_ID: prj_HS599jsot57tfq3rjZASbDKhA068
    steps:
      # No skip here: with Git deploys off for main, skipping would mean
      # production silently stops updating.
      - name: Check Vercel is configured
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Set the VERCEL_TOKEN secret. Production only deploys from this job. See docs/staging.md."
            exit 1
          }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Deploy to production
        run: npx --yes vercel@64.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"
