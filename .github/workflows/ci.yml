name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: nothing in CI talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  database:
    name: Migrations and seed from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase binds 54321-54329, which sits inside Linux's default ephemeral range
      # (32768-60999). An outgoing connection during the image pulls can grab one of
      # those ports first and the DB container then fails with "address already in use".
      # Moving the ephemeral range above 60000 keeps them free.
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - name: Start local Supabase (applies migrations + seed)
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Lint the schema
        run: npx supabase db lint --level warning --fail-on error
      - name: Check the seed landed
        run: |
          count=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "select count(*) from public.players")
          echo "players: $count"
          test "$count" -eq 23
