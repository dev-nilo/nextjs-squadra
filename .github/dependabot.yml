# Dependency updates as pull requests, through the same CI, staging preview and
# review as any other change. Minor and patch bumps come grouped, one PR a week
# per ecosystem; a major version comes on its own, since it may need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      npm-minor-e-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "Bump"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        update-types: [minor, patch, major]
    commit-message:
      prefix: "Bump"
